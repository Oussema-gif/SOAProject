openapi: 3.0.3
info:
  title: Maintenance REST API
  version: "1.0"
  description: Industrial monitoring — machines, technicians, alerts, work orders.
servers:
  - url: http://localhost:8081/api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType:   { type: string, example: Bearer }
        expiresInSeconds: { type: integer, example: 3600 }
        username: { type: string }
        role: { type: string, enum: [ADMIN, MAINTENANCE_OPERATOR, TECHNICIAN, INVENTORY_OPERATOR] }
    Machine:
      type: object
      properties:
        machineId: { type: string, example: MACHINE-001 }
        name: { type: string }
        location: { type: string }
        model: { type: string }
        status: { type: string, enum: [RUNNING, WARNING, CRITICAL, OFFLINE, MAINTENANCE] }
    AlertRequest:
      type: object
      required: [machineId, metricType, severity, observedValue, thresholdValue, message, occurredAt]
      properties:
        machineId: { type: string }
        metricType: { type: string, enum: [TEMPERATURE, VIBRATION, PRESSURE, ENERGY] }
        severity: { type: string, enum: [WARNING, CRITICAL] }
        observedValue: { type: number }
        thresholdValue: { type: number }
        message: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceEventId: { type: string }
    WorkOrderRequest:
      type: object
      required: [machineId, title]
      properties:
        machineId: { type: string }
        alertId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        details: { type: array, items: { type: string } }
paths:
  /auth/login:
    post:
      summary: Authenticate and get JWT
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { description: Bad credentials }
  /auth/me:
    get:
      summary: Current authenticated user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /machines:
    get:
      summary: List machines
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
      responses: { '200': { description: Paged list } }
    post:
      summary: Create machine
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/Machine' } } }
      responses: { '201': { description: Created }, '409': { description: Duplicate } }
  /machines/{machineId}:
    get:
      summary: Get machine by code
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: machineId, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /technicians:
    get:
      summary: List technicians
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Create technician (ADMIN)
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '403': { description: Forbidden }, '409': { description: Duplicate email } }
  /alerts:
    get:
      summary: List alerts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, RESOLVED] } }
        - { in: query, name: machineId, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
      responses: { '200': { description: Paged list } }
    post:
      summary: Create alert (idempotent on machine+metric and sourceEventId)
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRequest' } } }
      responses:
        '201': { description: New alert }
        '200': { description: Existing alert (deduplicated) }
  /alerts/{id}/acknowledge:
    patch:
      summary: Acknowledge alert (ACTIVE → ACKNOWLEDGED)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '409': { description: Invalid state } }
  /alerts/{id}/resolve:
    patch:
      summary: Resolve alert
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '409': { description: Already resolved } }
  /work-orders:
    get:
      summary: List work orders
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paged list } }
    post:
      summary: Create work order (200 if live one exists for alertId)
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderRequest' } } }
      responses:
        '201': { description: Created }
        '200': { description: Existing work order for alertId }
  /work-orders/{id}/status:
    patch:
      summary: Transition work-order status (validated server-side)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, CHECKING_INVENTORY, READY_FOR_MAINTENANCE, WAITING_FOR_PARTS, PENDING_RESERVATION, IN_PROGRESS, COMPLETED, CANCELLED] }
      responses: { '200': { description: OK }, '409': { description: Invalid transition } }
  /work-orders/{id}/assign:
    patch:
      summary: Assign technician
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '409': { description: Terminal WO } }
  /work-orders/{id}/reservation:
    patch:
      summary: Attach or release a reservation. ACTIVE → WO moves to READY_FOR_MAINTENANCE
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '409': { description: Conflict } }
