syntax = "proto3";
package soa.telemetry;

option java_multiple_files = true;
option java_package = "com.soa.telemetry";

service TelemetryService {
  rpc GetMachineSnapshot(MachineRequest) returns (TelemetrySnapshot);
  rpc StreamMachineTelemetry(MachineRequest) returns (stream TelemetryReading);
  rpc SendTelemetryBatch(stream TelemetryReading) returns (BatchResult);
  rpc MonitorMachines(MonitorRequest) returns (stream TelemetryReading);
}

message MachineRequest { string machine_id = 1; }

message TelemetrySnapshot {
  string machine_id = 1;
  double temperature_c = 2;
  double vibration_mm_s = 3;
  double pressure_bar = 4;
  double energy_kw = 5;
  int64 timestamp_epoch_ms = 6;
  string machine_status = 7;
}

message TelemetryReading {
  string machine_id = 1;
  double temperature_c = 2;
  double vibration_mm_s = 3;
  double pressure_bar = 4;
  double energy_kw = 5;
  int64 timestamp_epoch_ms = 6;
}

message BatchResult {
  int32 accepted_count = 1;
  int32 rejected_count = 2;
  string message = 3;
}

message MonitorRequest { repeated string machine_ids = 1; }